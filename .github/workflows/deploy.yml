name: Despliegue Automático de React a Hostinger

on:
  push:
    branches:
      - main # Cambia a master si tu rama principal se llama así

jobs:
  deploy:
    name: Build & Deploy React
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js (Actualizado a v24 y sin la línea de caché obligatoria)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. Instalar dependencias y compilar
      # Se usa 'npm install' en lugar de 'npm ci' si no tienes el archivo package-lock.json en el repo
      - name: Instalar dependencias y Compilar React
        run: |
          npm install
          npm run build

      # Paso 4: Subir la carpeta compilada a Hostinger por FTP
      - name: Subir build a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21 # Puerto estándar de FTP en Hostinger
          protocol: ftp # O usa 'ftps' si tienes SSL activo en el FTP de Hostinger
          local-dir: ./dist/ # O ./build/ según tu proyecto React
          server-dir: /public_html/